benchmark:
  runs:
    # YOLOv8 - самое популярное семейство
    - models:
        - family: yolov8
          sizes: [n, s, m, l, x]

    # YOLOv11 - новейшее семейство от Ultralytics
    - models:
        - family: yolo11
          sizes: [n, s, m, l, x]

    # YOLOv10 - оптимизировано для скорости
    - models:
        - family: yolov10
          sizes: [n, s, m, l, x]

    # YOLO26 - уже работает
    - models:
        - family: yolo26
          sizes: [n, s, m, l]

  formats:
    - pytorch
    - onnx
    - tensorrt
    - openvino
    - ncnn

  quantization:
    - fp32
    - fp16
    - int8

  devices:
    - cpu
    - mps
    - cuda

  task_type: detect
  device_type: auto
  input_size: 640
  batch_size: 1
  warmup_iterations: 10
  main_iterations: 100
  confidence_threshold: 0.25
  test_images: "/Users/stepanborodin/Downloads/students_ball/"

output:
  directory: "./results"
  formats:
    - json
    - csv
    - markdown
  timestamp: true

system_info:
  collect_cpu: true
  collect_gpu: true
  collect_power: true
  collect_temperature: true
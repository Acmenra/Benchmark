benchmark:
  runs:
    - models:
        - family: yolo26
          sizes: [n, s, m, l]

  formats:
    - pytorch
    - onnx
    - tensorrt
    - openvino

  quantization:
    - fp32
#    - fp16
    - int8

  task_type: detect
  device_type: auto
  input_size: 640
  batch_size: 1
  warmup_iterations: 10
  main_iterations: 100
  confidence_threshold: 0.25
  test_images: "/Users/stepanborodin/Downloads/students_ball/"

output:
  directory: "./results"
  formats:
    - json
    - csv
    - markdown
  timestamp: true

system_info:
  collect_cpu: true
  collect_gpu: true
  collect_power: true
  collect_temperature: true



